name: NE VAR signed APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate permanent signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.NEVAR_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.NEVAR_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing NEVAR_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASS" || { echo "Missing NEVAR_KEYSTORE_PASSWORD"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/nevar-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/nevar-release.jks" -storepass "$KEYSTORE_PASS" -alias nevar >/dev/null
      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Sign APK with permanent key
        env:
          KEYSTORE_PASS: ${{ secrets.NEVAR_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/nevar-release.jks" --ks-key-alias nevar --ks-pass env:KEYSTORE_PASS --key-pass env:KEYSTORE_PASS --out NE-VAR-signed.apk "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs NE-VAR-signed.apk
          test -s NE-VAR-signed.apk
          sha256sum NE-VAR-signed.apk > NE-VAR-signed.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: nevar-signed-apk
          path: |
            NE-VAR-signed.apk
            NE-VAR-signed.apk.sha256
      - name: Publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: signed-build-${{ github.run_number }}
        run: |
          gh release create "$TAG" NE-VAR-signed.apk NE-VAR-signed.apk.sha256 --target "$GITHUB_SHA" --title "NE VAR Signed Build ${{ github.run_number }}" --notes "Signed with permanent NE VAR signing key. Android package com.nevar.discovery."
