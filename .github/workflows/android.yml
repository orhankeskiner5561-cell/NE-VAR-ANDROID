name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore signing key
        env:
          SIGNING_KEY: ${{ secrets.NEVAR_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEY" || { echo "Missing NEVAR_KEYSTORE_BASE64"; exit 1; }
          printf '%s' "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/nevar-release.jks"
          echo "NEVAR_KEYSTORE_PATH=$RUNNER_TEMP/nevar-release.jks" >> "$GITHUB_ENV"
      - name: Validate signing credentials and certificate
        env:
          NEVAR_KEYSTORE_PASSWORD: ${{ secrets.NEVAR_KEYSTORE_PASSWORD }}
          NEVAR_KEY_ALIAS: ${{ secrets.NEVAR_KEY_ALIAS }}
          NEVAR_KEY_PASSWORD: ${{ secrets.NEVAR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -s "$NEVAR_KEYSTORE_PATH" || { echo "::error::Signing keystore is missing or empty"; exit 1; }
          test -n "$NEVAR_KEYSTORE_PASSWORD" && test -n "$NEVAR_KEY_ALIAS" && test -n "$NEVAR_KEY_PASSWORD" || { echo "::error::Signing credentials missing"; exit 1; }
          if ! keytool -list -keystore "$NEVAR_KEYSTORE_PATH" -storepass "$NEVAR_KEYSTORE_PASSWORD" -alias "$NEVAR_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore password or alias does not match the uploaded keystore"
            exit 1
          fi
          if ! keytool -importkeystore -srckeystore "$NEVAR_KEYSTORE_PATH" -srcstorepass "$NEVAR_KEYSTORE_PASSWORD" -srcalias "$NEVAR_KEY_ALIAS" -srckeypass "$NEVAR_KEY_PASSWORD" -destkeystore "$RUNNER_TEMP/signing-check.p12" -deststoretype PKCS12 -deststorepass "$NEVAR_KEYSTORE_PASSWORD" -destkeypass "$NEVAR_KEYSTORE_PASSWORD" -noprompt >/dev/null 2>&1; then
            echo "::error::Private key password does not match the keystore entry"
            exit 1
          fi
          ACTUAL_FINGERPRINT=$(keytool -list -v -keystore "$NEVAR_KEYSTORE_PATH" -storepass "$NEVAR_KEYSTORE_PASSWORD" -alias "$NEVAR_KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)
          EXPECTED_FINGERPRINT="DA:FB:37:7D:AE:A7:2B:4B:FF:47:DD:58:FD:39:99:EF:90:67:46:10:5F:79:00:8C:D6:6E:AC:4C:14:BF:BA:11"
          if [ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
            echo "::error::GitHub keystore certificate differs from the locally validated backup"
            exit 1
          fi
          echo "Signing keystore and key verified"
      - name: Build signed APK
        env:
          NEVAR_KEYSTORE_PASSWORD: ${{ secrets.NEVAR_KEYSTORE_PASSWORD }}
          NEVAR_KEY_ALIAS: ${{ secrets.NEVAR_KEY_ALIAS }}
          NEVAR_KEY_PASSWORD: ${{ secrets.NEVAR_KEY_PASSWORD }}
        run: |
          test -n "$NEVAR_KEYSTORE_PASSWORD" && test -n "$NEVAR_KEY_ALIAS" && test -n "$NEVAR_KEY_PASSWORD"
          gradle :app:assembleRelease --stacktrace -PnevarVersionCode="$((1000 + GITHUB_RUN_NUMBER))" -PnevarVersionName="0.4.$GITHUB_RUN_NUMBER"
      - name: Verify APK and prepare download
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.nevar.discovery'"
          cp "$APK" NE-VAR-release.apk
          sha256sum NE-VAR-release.apk > NE-VAR-release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: nevar-signed-apk
          path: |
            NE-VAR-release.apk
            NE-VAR-release.apk.sha256
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: signed-build-${{ github.run_number }}
        run: |
          gh release create "$TAG" NE-VAR-release.apk NE-VAR-release.apk.sha256 --target "$GITHUB_SHA" --title "NE VAR? Signed Build ${{ github.run_number }}" --notes "Signed release APK"
